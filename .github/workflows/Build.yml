name: Build Auto-Updating APK & Deploy iPhone Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "awraad-build-deploy"
  cancel-in-progress: false

jobs:
  check-bundle:
    runs-on: ubuntu-latest
    outputs:
      bundle_ready: ${{ steps.verify.outputs.bundle_ready }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify awraad-project.zip
        id: verify
        run: |
          if [ ! -f "awraad-project.zip" ] || [ ! -s "awraad-project.zip" ]; then
            echo "ERROR: awraad-project.zip missing ya empty hai!"
            exit 1
          fi
          unzip -l awraad-project.zip | grep -qi "index.html" || {
            echo "ERROR: awraad-project.zip ke andar index.html nahi mila!"
            exit 1
          }
          echo "bundle_ready=true" >> "$GITHUB_OUTPUT"
          echo "Bundle verified successfully."

  build-and-deploy:
    needs: check-bundle
    if: needs.check-bundle.outputs.bundle_ready == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Extract & Normalize awraad-project.zip
        run: |
          rm -rf raw_extract app_work
          mkdir -p raw_extract app_work/www app_work/assets
          unzip -oq awraad-project.zip -d raw_extract

          SRC_ROOT="raw_extract"
          TOP_COUNT=$(find raw_extract -mindepth 1 -maxdepth 1 | wc -l)
          if [ "$TOP_COUNT" -eq 1 ]; then
            ONLY_DIR=$(find raw_extract -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)
            if [ -n "$ONLY_DIR" ]; then
              SRC_ROOT="$ONLY_DIR"
            fi
          fi

          if [ -d "$SRC_ROOT/www" ] && [ -f "$SRC_ROOT/www/index.html" ]; then
            cp -a "$SRC_ROOT/www/." app_work/www/
          else
            find "$SRC_ROOT" -maxdepth 1 -type f \( \
              -name "*.html" -o -name "*.css" -o -name "*.js" -o \
              -name "*.json" -o -name "*.webmanifest" -o -name "*.png" -o \
              -name "*.jpg" -o -name "*.jpeg" -o -name "*.svg" -o -name "*.ico" \
            \) -exec cp -a {} app_work/www/ \;
          fi

          [ -d "$SRC_ROOT/assets" ] && cp -a "$SRC_ROOT/assets/." app_work/assets/
          [ -d "$SRC_ROOT/resources" ] && cp -a "$SRC_ROOT/resources" app_work/
          [ -f "$SRC_ROOT/capacitor.config.json" ] && cp -a "$SRC_ROOT/capacitor.config.json" app_work/
          [ -f "$SRC_ROOT/package.json" ] && cp -a "$SRC_ROOT/package.json" app_work/

          rm -f app_work/www/package.json app_work/www/package-lock.json app_work/www/capacitor.config.json

          if [ ! -f "app_work/capacitor.config.json" ]; then
            printf '%s\n' '{"appId":"com.awraad.nooriya","appName":"Awraad e Alaviya Nooriya","webDir":"www","bundledWebRuntime":false}' > app_work/capacitor.config.json
          fi

          if [ ! -f "app_work/package.json" ]; then
            printf '%s\n' '{"name":"awraad-e-alaviya-nooriya","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"^6.0.0","@capacitor/core":"^6.0.0","@capacitor/local-notifications":"^6.0.0"},"devDependencies":{"@capacitor/cli":"^6.0.0"}}' > app_work/package.json
          fi

          printf '{"build":%s,"version":"1.0.%s","updatedAt":"%s"}\n' \
            "${{ github.run_number }}" "${{ github.run_number }}" "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            > app_work/www/version.json

          touch app_work/www/.nojekyll
          test -f app_work/www/index.html

      - name: Prepare PNG Icon & Splash from icon.jpg if needed
        working-directory: app_work
        run: |
          if [ ! -f "assets/icon.png" ] && [ -f "assets/icon.jpg" ]; then
            if ! command -v convert >/dev/null 2>&1; then
              sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
            fi
            convert assets/icon.jpg -resize 1024x1024^ -gravity center -extent 1024x1024 assets/icon.png
            if [ ! -f "assets/splash.png" ]; then
              convert assets/icon.jpg -resize 2732x2732^ -gravity center -extent 2732x2732 assets/splash.png
            fi
            cp -f assets/icon.png www/apple-touch-icon.png || true
          fi

      - name: Install Capacitor 6 & Add Android Platform
        working-directory: app_work
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Generate Native Icons & Splash
        working-directory: app_work
        run: |
          if [ -f "assets/icon.png" ] || [ -f "assets/icon-only.png" ] || [ -f "assets/splash.png" ]; then
            npm install --no-save @capacitor/assets || true
            npx capacitor-assets generate --android || echo "WARN: Asset generation skipped cleanly."
          fi

      - name: Patch Android Permissions & Build Version
        working-directory: app_work
        run: |
          python3 -c '
          import os, re
          run_num = os.environ.get("GITHUB_RUN_NUMBER", "1")
          mp = "android/app/src/main/AndroidManifest.xml"
          gp = "android/app/build.gradle"
          if os.path.exists(mp):
              xml = open(mp, encoding="utf-8").read()
              perms = [
                  "android.permission.POST_NOTIFICATIONS",
                  "android.permission.SCHEDULE_EXACT_ALARM",
                  "android.permission.RECEIVE_BOOT_COMPLETED",
                  "android.permission.WAKE_LOCK",
              ]
              add = [f"    <uses-permission android:name=\"{p}\" />" for p in perms if p not in xml]
              if add:
                  xml = xml.replace("<application", "\n".join(add) + "\n\n    <application", 1)
                  open(mp, "w", encoding="utf-8").write(xml)
          if os.path.exists(gp):
              g = open(gp, encoding="utf-8").read()
              g = re.sub(r"versionCode\s+\d+", f"versionCode {run_num}", g)
              g = re.sub(r"versionName\s+\"[^\"]*\"", f"versionName \"1.0.{run_num}\"", g)
              open(gp, "w", encoding="utf-8").write(g)
          '

      - name: Build Android APK
        working-directory: app_work/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          APK_SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          test -n "$APK_SRC"
          cp "$APK_SRC" "${{ github.workspace }}/Awraad-e-Alaviya-Nooriya-Build-${{ github.run_number }}.apk"

      - name: Deploy iPhone Web App to gh-pages Branch
        working-directory: app_work/www
        run: |
          rm -rf .git
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B gh-pages
          git add -A
          git commit -m "Deploy iPhone Web App - Build #${{ github.run_number }}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Clean Old Releases & Publish Latest APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OLD_TAGS=$(gh release list --limit 20 --json tagName -q '.[].tagName' || true)
          for tag in $OLD_TAGS; do
            gh release delete "$tag" --yes --cleanup-tag || true
          done
          APK_FILE="Awraad-e-Alaviya-Nooriya-Build-${{ github.run_number }}.apk"
          gh release create "v1.0.${{ github.run_number }}" "$APK_FILE" \
            --title "Awraad e Alaviya Nooriya - Build #${{ github.run_number }}" \
            --notes "Auto-built APK #${{ github.run_number }} + iPhone PWA deployed to gh-pages."
