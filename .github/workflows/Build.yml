      - name: Compile Android APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            printf "%s" "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > ~/.android/debug.keystore
            echo "✅ Permanent signing keystore loaded from ANDROID_KEYSTORE_BASE64"
            keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | grep -i "SHA-256" || true
          else
            echo "⚠️ ANDROID_KEYSTORE_BASE64 secret not set — using ephemeral debug keystore"
          fi
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "../Awraad-e-Alaviya-Nooriya.apk"
          ls -lh "../Awraad-e-Alaviya-Nooriya.apk"

      - name: Deploy 2-in-1 Live Web App to GitHub Pages
