name: Build Auto-Updating APK & Deploy iPhone Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: write

jobs:
  check-bundle:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Check awraad-project.zip
        id: check
        run: |
          if [ -s "awraad-project.zip" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ awraad-project.zip found. Starting build..."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ awraad-project.zip not found or empty. Skipping build cleanly."
          fi

  build-and-deploy:
    needs: check-bundle
    if: needs.check-bundle.outputs.exists == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract Project Bundle & Restore Core Capacitor Files
        run: |
          unzip -o awraad-project.zip

          if [ ! -f "package.json" ] || [ ! -f "capacitor.config.json" ] || [ ! -d "assets" ]; then
            echo "ℹ️ Lightweight zip detected. Restoring core Capacitor files from git history..."
            for commit in $(git log -n 50 --format="%H" -- awraad-project.zip); do
              git show "${commit}:awraad-project.zip" > /tmp/prev_bundle.zip 2>/dev/null || continue
              if unzip -l /tmp/prev_bundle.zip 2>/dev/null | grep -q "package.json"; then
                echo "✅ Core files found in commit $commit"
                [ -f "package.json" ] || unzip -o /tmp/prev_bundle.zip "package.json" 2>/dev/null || true
                [ -f "capacitor.config.json" ] || unzip -o /tmp/prev_bundle.zip "capacitor.config.json" 2>/dev/null || true
                [ -d "assets" ] || unzip -o /tmp/prev_bundle.zip "assets/*" 2>/dev/null || true
                rm -f /tmp/prev_bundle.zip
                break
              fi
            done
            rm -f /tmp/prev_bundle.zip
          fi

          if [ ! -f "package.json" ]; then
            echo "⚠️ Creating fallback Capacitor 6 package.json..."
            cat << 'PKG_EOF' > package.json
          {
            "name": "awraad-e-alaviya-nooriya",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/core": "^6.0.0",
              "@capacitor/local-notifications": "^6.0.0"
            },
            "devDependencies": {
              "@capacitor/assets": "^3.0.5",
              "@capacitor/cli": "^6.0.0"
            }
          }
          PKG_EOF
          fi

          if [ ! -f "capacitor.config.json" ]; then
            echo "⚠️ Creating fallback capacitor.config.json..."
            cat << 'CAP_EOF' > capacitor.config.json
          {
            "appId": "com.awraad.nooriya",
            "appName": "Awraad e Alaviya Nooriya",
            "webDir": "www"
          }
          CAP_EOF
          fi

          ls -la package.json capacitor.config.json

      - name: Ensure Uncropped App Icon & Delete Old Native Splashes
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick

          rm -f assets/full_splash.png assets/splash.png assets/splash-dark.png

          if [ -f "assets/original_icon.png" ]; then
            convert assets/original_icon.png -resize 760x760 -background "#0c3b2e" -gravity center -extent 1024x1024 assets/icon.png
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Capacitor Dependencies
        run: |
          npm install

      - name: Prepare 2-in-1 Web App (iPhone PWA + Android Live Sync)
        run: |
          touch www/.nojekyll

          SOURCE_ICON=""
          if [ -f "assets/original_icon.png" ]; then
            SOURCE_ICON="assets/original_icon.png"
          elif [ -f "assets/icon.png" ]; then
            SOURCE_ICON="assets/icon.png"
          fi

          if [ -n "$SOURCE_ICON" ]; then
            convert "$SOURCE_ICON" -resize 150x150 -background "#0c3b2e" -gravity center -extent 180x180 -alpha remove -alpha off www/apple-touch-icon.png
            convert "$SOURCE_ICON" -resize 160x160 -background "#0c3b2e" -gravity center -extent 192x192 -alpha remove -alpha off www/icon-192.png
            convert "$SOURCE_ICON" -resize 420x420 -background "#0c3b2e" -gravity center -extent 512x512 -alpha remove -alpha off www/icon-512.png
            cp www/icon-512.png www/icon.png
          fi

          if [ ! -f "www/manifest.json" ]; then
            cat << 'EOF' > www/manifest.json
          {
            "name": "Awraad e Alaviya Nooriya",
            "short_name": "Awraad",
            "description": "Awraad e Alaviya Nooriya Web & Mobile App",
            "start_url": "./index.html",
            "scope": "./",
            "display": "standalone",
            "orientation": "portrait",
            "background_color": "#f6f8f4",
            "theme_color": "#0c3b2e",
            "icons": [
              {
                "src": "./icon-192.png",
                "sizes": "192x192",
                "type": "image/png",
                "purpose": "any maskable"
              },
              {
                "src": "./icon-512.png",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "any maskable"
              }
            ]
          }
          EOF
          fi

          if [ ! -s "www/theme-preload.js" ]; then
            cat << 'EOF' > www/theme-preload.js
          (function() {
            try {
              var root = document.documentElement;
              var head = document.head || root;
              try {
                if (!sessionStorage.getItem('awraad_splash_shown')) {
                  root.classList.add('awraad-splash-pending');
                  if (head) {
                    var sp = document.createElement('style');
                    sp.id = 'awraad-splash-preload-style';
                    sp.textContent = '@media screen{html.awraad-splash-pending::before{content:"";position:fixed;inset:0;background:#f6f8f4 !important;z-index:2147483646;pointer-events:auto;}}';
                    head.appendChild(sp);
                  }
                  setTimeout(function() { root.classList.remove('awraad-splash-pending'); }, 11000);
                }
              } catch (e) {}
            } catch (e) {}
          })();
          EOF
          fi

          cat << EOF > www/version.json
          {"build":"${{ github.run_number }}","sha":"${{ github.sha }}","ts":$(date +%s)}
          EOF

          cat << 'EOF' > www/pwa-init.js
          if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
            const hadController = Boolean(navigator.serviceWorker.controller);
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
              if (hadController && !refreshing) {
                refreshing = true;
                window.location.reload();
              }
            });
            window.addEventListener('load', () => {
              navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then((reg) => {
                reg.update();
                setInterval(() => { reg.update().catch(() => {}); }, 25000);
              }).catch(() => {});
            });
          }
          EOF

          cat << 'SW_GEN_EOF' > /tmp/gen_sw.js
          const fs = require("fs");
          const path = require("path");
          function walk(dir, base = "") {
            let out = [];
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const rel = base ? base + "/" + entry.name : entry.name;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) out = out.concat(walk(full, rel));
              else if (/\.(html|css|js|json|woff2|ttf|mp3|m4a|wav|ogg)$/i.test(entry.name) && entry.name !== "sw.js" && entry.name !== "version.json") {
                out.push("./" + rel);
              }
            }
            return out;
          }
          const allAssets = Array.from(new Set(["./", ...walk("www")]));
          const buildNum = process.env.BUILD_NUM || "1";
          const swLines = [
            "const CACHE_NAME = \"awraad-live-v" + buildNum + "\";",
            "const CORE_ASSETS = " + JSON.stringify(allAssets, null, 2) + ";",
            "",
            "self.addEventListener(\"install\", (event) => {",
            "  event.waitUntil(",
            "    caches.open(CACHE_NAME).then((cache) =>",
            "      Promise.all(CORE_ASSETS.map((url) =>",
            "        fetch(url, { cache: \"reload\" })",
            "          .then((res) => (res && res.status === 200 ? cache.put(url, res) : null))",
            "          .catch(() => {})",
            "      ))",
            "    )",
            "  );",
            "  self.skipWaiting();",
            "});",
            "",
            "self.addEventListener(\"activate\", (event) => {",
            "  event.waitUntil(",
            "    caches.keys().then((keys) =>",
            "      Promise.all(keys.filter((k) => k !== CACHE_NAME).map((k) => caches.delete(k)))",
            "    )",
            "  );",
            "  self.clients.claim();",
            "});",
            "",
            "self.addEventListener(\"fetch\", (event) => {",
            "  if (event.request.method !== \"GET\") return;",
            "  const url = new URL(event.request.url);",
            "",
            "  if (url.origin !== self.location.origin) return;",
            "  if (/googletagmanager|google-analytics|analytics\\.google/i.test(url.hostname + url.pathname)) return;",
            "",
            "  if (url.pathname.endsWith(\"/version.json\") || url.pathname.endsWith(\"version.json\")) {",
            "    event.respondWith(fetch(event.request, { cache: \"no-store\" }));",
            "    return;",
            "  }",
            "",
            "  event.respondWith(",
            "    fetch(event.request, { cache: \"no-store\" })",
            "      .then((response) => {",
            "        if (response && response.status === 200) {",
            "          const copy = response.clone();",
            "          caches.open(CACHE_NAME).then((cache) => cache.put(event.request, copy));",
            "        }",
            "        return response;",
            "      })",
            "      .catch(() => caches.match(event.request, { ignoreSearch: true }))",
            "  );",
            "});"
          ];
          fs.writeFileSync("www/sw.js", swLines.join("\n") + "\n", "utf8");
          SW_GEN_EOF
          BUILD_NUM="${{ github.run_number }}" node /tmp/gen_sw.js

          cat << 'HTML_INJECT_EOF' > /tmp/inject_html.js
          const fs = require("fs");
          const path = require("path");
          const buildNum = process.env.BUILD_NUM || String(Date.now());

          function applyZoomLockViewport(html) {
            const lockContent = "width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover";
            if (/<meta\b[^>]*name=["']viewport["'][^>]*>/i.test(html)) {
              return html.replace(/<meta\b[^>]*name=["']viewport["'][^>]*>/i, '<meta name="viewport" content="' + lockContent + '">');
            }
            const vpTag = '  <meta name="viewport" content="' + lockContent + '">';
            return /<head\b[^>]*>/i.test(html)
              ? html.replace(/(<head\b[^>]*>)/i, "$1\n" + vpTag)
              : vpTag + "\n" + html;
          }

          function getAllHtmlFiles(dir, depth = 0) {
            let results = [];
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                results = results.concat(getAllHtmlFiles(full, depth + 1));
              } else if (entry.name.toLowerCase().endsWith(".html")) {
                results.push({ fullPath: full, prefix: depth === 0 ? "./" : "../".repeat(depth) });
              }
            }
            return results;
          }

          for (const { fullPath, prefix } of getAllHtmlFiles("www")) {
            let html = fs.readFileSync(fullPath, "utf8");
            html = applyZoomLockViewport(html);

            html = html.replace(/[ \t]*<meta\b[^>]*name=["']awraad-build["'][^>]*>\r?\n?/gi, "");
            const buildMeta = '  <meta name="awraad-build" content="' + buildNum + '">';

            const iosMeta = [
              "  <meta name=\"apple-mobile-web-app-capable\" content=\"yes\">",
              "  <meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">",
              "  <meta name=\"apple-mobile-web-app-title\" content=\"Awraad\">",
              "  <meta name=\"theme-color\" content=\"#0c3b2e\">",
              "  <link rel=\"apple-touch-icon\" sizes=\"180x180\" href=\"" + prefix + "apple-touch-icon.png\">",
              "  <link rel=\"manifest\" href=\"" + prefix + "manifest.json\">",
              "  <script src=\"" + prefix + "pwa-init.js?v=" + buildNum + "\" defer></script>"
            ].join("\n");

            html = html.replace(/[ \t]*<script[^>]+theme-preload\.js[^>]*><\/script>\r?\n?/gi, "");
            const preloadTag = "  <script src=\"" + prefix + "theme-preload.js?v=" + buildNum + "\"></script>";
            if (/<head\b[^>]*>/i.test(html)) {
              html = html.replace(/(<head\b[^>]*>)/i, "$1\n" + buildMeta + "\n" + preloadTag);
            } else {
              html = buildMeta + "\n" + preloadTag + "\n" + html;
            }

            if (!html.includes("apple-mobile-web-app-capable")) {
              if (/<\/head>/i.test(html)) {
                html = html.replace(/<\/head>/i, iosMeta + "\n</head>");
              } else {
                html = iosMeta + "\n" + html;
              }
            }

            html = html.replace(
              /(href|src)=["']([^"']*?(?:Tajweed_Style\.css|Tajweed_rules\.js|theme-preload\.js|pwa-init\.js|events-config\.js))(?:\?[^"']*)?["']/gi,
              '$1="$2?v=' + buildNum + '"'
            );

            fs.writeFileSync(fullPath, html, "utf8");
          }
          HTML_INJECT_EOF
          BUILD_NUM="${{ github.run_number }}" node /tmp/inject_html.js

      - name: Connect Android APK to Live GitHub Pages URL (Zero-Reinstall Updates)
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          REPO_LOWER=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')

          if [ "$REPO_LOWER" = "${OWNER}.github.io" ]; then
            PAGES_URL="https://${OWNER}.github.io/"
          else
            PAGES_URL="https://${OWNER}.github.io/${REPO}/"
          fi

          echo "Live Auto-Update URL: $PAGES_URL"

          cat << 'CAP_CFG_EOF' > /tmp/update_cap.js
          const fs = require("fs");
          const url = process.env.PAGES_URL;
          const host = new URL(url).hostname;

          if (fs.existsSync("capacitor.config.json")) {
            const cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            delete cfg.bundledWebRuntime;
            cfg.backgroundColor = "#f6f8f4";
            cfg.android = { ...(cfg.android || {}), backgroundColor: "#f6f8f4" };
            cfg.server = {
              ...(cfg.server || {}),
              url: url,
              cleartext: false,
              errorPath: "index.html",
              allowNavigation: [host]
            };
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
          }
          CAP_CFG_EOF
          PAGES_URL="$PAGES_URL" node /tmp/update_cap.js

      - name: Generate Native Android Project & Hide Android 12+ Default Icon Splash
        run: |
          [ -d "android" ] || npx cap add android

          rm -f assets/full_splash.png assets/splash.png assets/splash-dark.png
          npx @capacitor/assets generate --android --iconBackgroundColor "#0c3b2e"
          npx cap sync android

          sed -i "s/versionCode [0-9]\+/versionCode ${{ github.run_number }}/g" android/app/build.gradle

          rm -rf android/app/src/main/res/drawable-port-*
          rm -rf android/app/src/main/res/drawable-land-*
          find android/app/src/main/res -type f -iname "*splash*.png" -delete

          mkdir -p android/app/src/main/res/drawable
          cat << 'EOF' > android/app/src/main/res/drawable/splash_transparent.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="@android:color/transparent" />
              <size android:width="1dp" android:height="1dp" />
          </shape>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/launch_splash.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#f6f8f4" />
          </shape>
          EOF

          mkdir -p android/app/src/main/res/values android/app/src/main/res/values-night
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">#0c3b2e</item>
                  <item name="colorPrimaryDark">#0c3b2e</item>
                  <item name="colorAccent">#d4af37</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:background">@null</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">@drawable/launch_splash</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:statusBarColor">#f6f8f4</item>
                  <item name="android:navigationBarColor">#f6f8f4</item>
              </style>
          </resources>
          EOF
          cp android/app/src/main/res/values/styles.xml android/app/src/main/res/values-night/styles.xml

          mkdir -p android/app/src/main/res/values-v31 android/app/src/main/res/values-night-v31
          cat << 'EOF' > android/app/src/main/res/values-v31/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">@drawable/launch_splash</item>
                  <item name="android:windowSplashScreenBackground">#f6f8f4</item>
                  <item name="android:windowSplashScreenIconBackgroundColor">#f6f8f4</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/splash_transparent</item>
                  <item name="android:windowSplashScreenAnimationDuration">0</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:statusBarColor">#f6f8f4</item>
                  <item name="android:navigationBarColor">#f6f8f4</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowLightNavigationBar">true</item>
              </style>
          </resources>
          EOF
          cp android/app/src/main/res/values-v31/styles.xml android/app/src/main/res/values-night-v31/styles.xml

      - name: Add Android Notification Permissions (Urs & Fatiha Alerts)
        run: |
          cat << 'PERM_EOF' > /tmp/add_perms.js
          const fs = require("fs");
          const p = "android/app/src/main/AndroidManifest.xml";
          let xml = fs.readFileSync(p, "utf8");
          const perms = [
            "android.permission.POST_NOTIFICATIONS",
            "android.permission.SCHEDULE_EXACT_ALARM"
          ];
          for (const perm of perms) {
            if (!xml.includes(perm)) {
              xml = xml.replace(
                "<application",
                "    <uses-permission android:name=\"" + perm + "\" />\n    <application"
              );
            }
          }
          fs.writeFileSync(p, xml, "utf8");
          PERM_EOF
          node /tmp/add_perms.js

      - name: Add Android System-Level Always-on-Top Tasbeeh Overlay
        run: |
          cat << 'OVERLAY_SETUP_EOF' > /tmp/setup_android_overlay.js
          const fs = require("fs");
          const path = require("path");

          // 1. Update AndroidManifest.xml with SYSTEM_ALERT_WINDOW, Foreground Service & TasbeehOverlayService
          const manifestPath = "android/app/src/main/AndroidManifest.xml";
          let xml = fs.readFileSync(manifestPath, "utf8");
          const overlayPerms = [
            "android.permission.SYSTEM_ALERT_WINDOW",
            "android.permission.FOREGROUND_SERVICE",
            "android.permission.FOREGROUND_SERVICE_SPECIAL_USE",
            "android.permission.VIBRATE"
          ];
          for (const perm of overlayPerms) {
            if (!xml.includes(perm)) {
              xml = xml.replace(
                "<application",
                '    <uses-permission android:name="' + perm + '" />\n    <application'
              );
            }
          }
          if (!xml.includes("TasbeehOverlayService")) {
            const serviceTag = [
              '        <service',
              '            android:name=".TasbeehOverlayService"',
              '            android:enabled="true"',
              '            android:exported="false"',
              '            android:foregroundServiceType="specialUse">',
              '            <property',
              '                android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"',
              '                android:value="User-controlled Always-on-Top Tasbeeh counter overlay" />',
              '        </service>'
            ].join("\n");
            xml = xml.replace("</application>", serviceTag + "\n    </application>");
          }
          fs.writeFileSync(manifestPath, xml, "utf8");

          // 2. Read real appId from capacitor.config.json (e.g. com.awraad.nooriya) & write Native Android Package Files
          let appId = "com.awraad.nooriya";
          try {
            const capCfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            if (capCfg && capCfg.appId) appId = String(capCfg.appId).trim();
          } catch (e) {}
          const pkgDir = path.join("android/app/src/main/java", ...appId.split("."));
          fs.mkdirSync(pkgDir, { recursive: true });
          console.log("ℹ️ Wiring TasbeehOverlay into exact package:", appId);

          const serviceJava = `package ${appId};

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.res.AssetFileDescriptor;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.media.MediaPlayer;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.provider.Settings;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class TasbeehOverlayService extends Service {
              public static final String PREFS = "awraad_tasbeeh_overlay_prefs";
              private static final String CHANNEL_ID = "awraad_tasbeeh_overlay_ch";
              private static final int NOTIF_ID = 44019;
              private static final int FGS_TYPE_SPECIAL_USE = 1073741824; // 0x40000000

              private WindowManager windowManager;
              private LinearLayout rootView;
              private WindowManager.LayoutParams params;
              private TextView titleView;
              private TextView countView;
              private Button tapBtn;
              private Button autoToggleBtn;
              private Button resetBtn;
              private Button minusBtn;
              private Button plusBtn;
              private Button closeBtn;

              private int count = 0;
              private int target = 100;
              private String mode = "manual";
              private int intervalSec = 1;
              private int scalePct = 45;
              private boolean soundEnabled = true;
              private boolean vibrateEnabled = true;
              private boolean completionPlayed = false;
              private boolean autoRunning = false;

              private final Handler handler = new Handler(Looper.getMainLooper());
              private MediaPlayer mediaPlayer;
              private int allahPlaysLeft = 0;

              private final Runnable autoTick = new Runnable() {
                  @Override
                  public void run() {
                      if (!autoRunning) return;
                      incrementCounter(false);
                      if (autoRunning) {
                          handler.postDelayed(this, Math.max(1000L, intervalSec * 1000L));
                      }
                  }
              };

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  if (intent != null) {
                      count = intent.getIntExtra("count", count);
                      target = Math.max(1, intent.getIntExtra("target", target));
                      String m = intent.getStringExtra("mode");
                      if (m != null) mode = m;
                      intervalSec = Math.max(1, intent.getIntExtra("intervalSec", intervalSec));
                      scalePct = Math.min(115, Math.max(45, intent.getIntExtra("scalePct", scalePct)));
                      soundEnabled = intent.getBooleanExtra("soundEnabled", soundEnabled);
                      vibrateEnabled = intent.getBooleanExtra("vibrateEnabled", vibrateEnabled);
                      if (count < target) completionPlayed = false;
                  }
                  startAsForeground();
                  if (rootView == null) {
                      buildOverlayView();
                  }
                  applyScaleLayout();
                  refreshLabels();
                  persistState();
                  return START_STICKY;
              }

              private void startAsForeground() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel ch = new NotificationChannel(
                          CHANNEL_ID,
                          "Tasbeeh Always-on-Top Overlay",
                          NotificationManager.IMPORTANCE_LOW
                      );
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) nm.createNotificationChannel(ch);
                  }
                  Intent openApp = new Intent(this, MainActivity.class);
                  openApp.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  int piFlags = Build.VERSION.SDK_INT >= Build.VERSION_CODES.M
                      ? PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT
                      : PendingIntent.FLAG_UPDATE_CURRENT;
                  PendingIntent pi = PendingIntent.getActivity(this, 0, openApp, piFlags);

                  Notification.Builder nb = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                      ? new Notification.Builder(this, CHANNEL_ID)
                      : new Notification.Builder(this);
                  Notification notif = nb
                      .setContentTitle("Tasbeeh Counter Overlay")
                      .setContentText("Count: " + count + " / " + target + " — Tap to return to Awraad")
                      .setSmallIcon(getApplicationInfo().icon != 0 ? getApplicationInfo().icon : android.R.drawable.ic_dialog_info)
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .build();

                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(NOTIF_ID, notif, FGS_TYPE_SPECIAL_USE);
                  } else {
                      startForeground(NOTIF_ID, notif);
                  }
              }

              private int dp(float v) {
                  return Math.round(TypedValue.applyDimension(
                      TypedValue.COMPLEX_UNIT_DIP, v, getResources().getDisplayMetrics()
                  ));
              }

              private GradientDrawable roundedBg(int fillColor, int strokeColor, int radiusDp) {
                  GradientDrawable gd = new GradientDrawable();
                  gd.setColor(fillColor);
                  gd.setStroke(dp(1.5f), strokeColor);
                  gd.setCornerRadius(dp(radiusDp));
                  return gd;
              }

              private void buildOverlayView() {
                  windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
                  rootView = new LinearLayout(this) {
                      private int dInitX, dInitY;
                      private float dTouchX, dTouchY;
                      private boolean dragging = false;
                      private final int dragSlop = dp(6);
                      @Override
                      public boolean onInterceptTouchEvent(MotionEvent ev) {
                          if (params == null) return false;
                          switch (ev.getActionMasked()) {
                              case MotionEvent.ACTION_DOWN:
                                  dInitX = params.x;
                                  dInitY = params.y;
                                  dTouchX = ev.getRawX();
                                  dTouchY = ev.getRawY();
                                  dragging = false;
                                  return false;
                              case MotionEvent.ACTION_MOVE:
                                  if (Math.abs(ev.getRawX() - dTouchX) > dragSlop || Math.abs(ev.getRawY() - dTouchY) > dragSlop) {
                                      dragging = true;
                                      return true;
                                  }
                                  return false;
                              case MotionEvent.ACTION_UP:
                              case MotionEvent.ACTION_CANCEL:
                                  dragging = false;
                                  return false;
                          }
                          return false;
                      }
                      @Override
                      public boolean onTouchEvent(MotionEvent ev) {
                          if (params == null) return false;
                          switch (ev.getActionMasked()) {
                              case MotionEvent.ACTION_DOWN:
                                  dInitX = params.x;
                                  dInitY = params.y;
                                  dTouchX = ev.getRawX();
                                  dTouchY = ev.getRawY();
                                  dragging = false;
                                  return true;
                              case MotionEvent.ACTION_MOVE:
                                  if (!dragging && (Math.abs(ev.getRawX() - dTouchX) > dragSlop || Math.abs(ev.getRawY() - dTouchY) > dragSlop)) {
                                      dragging = true;
                                  }
                                  if (dragging) {
                                      android.util.DisplayMetrics dm = getResources().getDisplayMetrics();
                                      int vw = getWidth() > 0 ? getWidth() : params.width;
                                      int vh = getHeight() > 0 ? getHeight() : dp(200);
                                      int maxX = Math.max(0, dm.widthPixels - Math.max(vw, dp(80)));
                                      int maxY = Math.max(0, dm.heightPixels - Math.max(vh, dp(80)));
                                      params.x = Math.max(0, Math.min(maxX, dInitX + Math.round(ev.getRawX() - dTouchX)));
                                      params.y = Math.max(0, Math.min(maxY, dInitY + Math.round(ev.getRawY() - dTouchY)));
                                      try { windowManager.updateViewLayout(this, params); } catch (Exception ignored) {}
                                  }
                                  return true;
                              case MotionEvent.ACTION_UP:
                              case MotionEvent.ACTION_CANCEL:
                                  if (dragging) {
                                      dragging = false;
                                      getSharedPreferences(PREFS, MODE_PRIVATE).edit()
                                          .putInt("pos_x", params.x)
                                          .putInt("pos_y", params.y)
                                          .apply();
                                  }
                                  return true;
                          }
                          return super.onTouchEvent(ev);
                      }
                  };
                  rootView.setOrientation(LinearLayout.VERTICAL);
                  rootView.setGravity(Gravity.CENTER_HORIZONTAL);
                  rootView.setBackground(roundedBg(Color.parseColor("#F50C3B2E"), Color.parseColor("#C59B27"), 14));

                  // Header / Drag Bar
                  LinearLayout header = new LinearLayout(this);
                  header.setOrientation(LinearLayout.HORIZONTAL);
                  header.setGravity(Gravity.CENTER_VERTICAL);

                  titleView = new TextView(this);
                  titleView.setText("Tasbeeh");
                  titleView.setTextColor(Color.parseColor("#F6E099"));
                  titleView.setTypeface(Typeface.DEFAULT_BOLD);
                  LinearLayout.LayoutParams titleLp = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
                  header.addView(titleView, titleLp);

                  minusBtn = makeMiniBtn("-");
                  plusBtn = makeMiniBtn("+");
                  closeBtn = makeMiniBtn("x");
                  header.addView(minusBtn);
                  header.addView(plusBtn);
                  header.addView(closeBtn);
                  rootView.addView(header);

                  countView = new TextView(this);
                  countView.setTextColor(Color.WHITE);
                  countView.setTypeface(Typeface.DEFAULT_BOLD);
                  countView.setGravity(Gravity.CENTER);
                  rootView.addView(countView);

                  tapBtn = new Button(this);
                  tapBtn.setText("TAP");
                  tapBtn.setTextColor(Color.WHITE);
                  tapBtn.setTypeface(Typeface.DEFAULT_BOLD);
                  tapBtn.setBackground(roundedBg(Color.parseColor("#1E7E34"), Color.parseColor("#F6E099"), 999));
                  rootView.addView(tapBtn);

                  LinearLayout footer = new LinearLayout(this);
                  footer.setOrientation(LinearLayout.HORIZONTAL);
                  footer.setGravity(Gravity.CENTER);

                  autoToggleBtn = makeActionBtn("Auto", "#1A365D");
                  resetBtn = makeActionBtn("Reset", "#C0392B");
                  footer.addView(autoToggleBtn);
                  footer.addView(resetBtn);
                  rootView.addView(footer);

                  int layoutType = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                      ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      : WindowManager.LayoutParams.TYPE_PHONE;

                  SharedPreferences sp = getSharedPreferences(PREFS, MODE_PRIVATE);
                  params = new WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      layoutType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  );
                  params.gravity = Gravity.TOP | Gravity.LEFT;
                  params.x = sp.getInt("pos_x", dp(16));
                  params.y = sp.getInt("pos_y", dp(90));

                  // Drag handled globally on rootView

                  minusBtn.setOnClickListener(v -> {
                      scalePct = Math.max(45, scalePct - 10);
                      applyScaleLayout();
                      persistState();
                  });
                  plusBtn.setOnClickListener(v -> {
                      scalePct = Math.min(115, scalePct + 10);
                      applyScaleLayout();
                      persistState();
                  });
                  closeBtn.setOnClickListener(v -> {
                      stopAuto();
                      stopAllahAudio();
                      persistState();
                      stopSelf();
                  });
                  tapBtn.setOnClickListener(v -> incrementCounter(true));
                  autoToggleBtn.setOnClickListener(v -> {
                      if (autoRunning) {
                          stopAuto();
                      } else {
                          mode = "auto";
                          startAuto();
                      }
                      refreshLabels();
                  });
                  resetBtn.setOnClickListener(v -> {
                      stopAuto();
                      stopAllahAudio();
                      count = 0;
                      completionPlayed = false;
                      refreshLabels();
                      persistState();
                  });

                  windowManager.addView(rootView, params);
              }

              private Button makeMiniBtn(String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextColor(Color.parseColor("#F6E099"));
                  b.setBackground(roundedBg(Color.parseColor("#33FFFFFF"), Color.parseColor("#88F6E099"), 6));
                  b.setPadding(0, 0, 0, 0);
                  b.setMinWidth(0);
                  b.setMinimumWidth(0);
                  b.setMinHeight(0);
                  b.setMinimumHeight(0);
                  return b;
              }

              private Button makeActionBtn(String text, String hexBg) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setAllCaps(false);
                  b.setTextColor(Color.WHITE);
                  b.setBackground(roundedBg(Color.parseColor(hexBg), Color.parseColor("#C59B27"), 8));
                  b.setMinWidth(0);
                  b.setMinimumWidth(0);
                  b.setMinHeight(0);
                  b.setMinimumHeight(0);
                  return b;
              }

              private void applyScaleLayout() {
                  if (rootView == null) return;
                  android.util.DisplayMetrics dm = getResources().getDisplayMetrics();
                  int clampedPct = Math.max(45, Math.min(115, scalePct));
                  float frac = (clampedPct - 45f) / 70f;
                  float widthRatio = 0.46f + frac * 0.44f;
                  int boxWidth = Math.max(dp(180), Math.min((int)(dm.widthPixels * 0.92f), Math.round(dm.widthPixels * widthRatio)));
                  float s = boxWidth / (float) dp(180);

                  int pad = dp(9f * s);
                  rootView.setPadding(pad, pad, pad, pad);

                  if (titleView != null && titleView.getParent() instanceof LinearLayout) {
                      LinearLayout hdr = (LinearLayout) titleView.getParent();
                      LinearLayout.LayoutParams hdrLp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      );
                      hdrLp.setMargins(0, 0, 0, dp(4f * s));
                      hdr.setLayoutParams(hdrLp);
                      hdr.setGravity(Gravity.CENTER_VERTICAL);
                      titleView.setSingleLine(true);
                      titleView.setEllipsize(android.text.TextUtils.TruncateAt.END);
                      titleView.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                      titleView.setTextSize(TypedValue.COMPLEX_UNIT_SP, Math.max(11f, 12f * s));
                  }

                  if (countView != null) {
                      countView.setSingleLine(true);
                      countView.setGravity(Gravity.CENTER);
                      countView.setLayoutParams(new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ));
                      countView.setTextSize(TypedValue.COMPLEX_UNIT_SP, Math.max(24f, 26f * s));
                      countView.setPadding(0, dp(4f * s), 0, dp(6f * s));
                  }

                  int miniSz = dp(Math.max(24f, 25f * s));
                  int miniMargin = dp(3);
                  Button[] minis = new Button[] { minusBtn, plusBtn, closeBtn };
                  for (Button b : minis) {
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(miniSz, miniSz);
                      lp.setMargins(miniMargin, 0, 0, 0);
                      b.setLayoutParams(lp);
                      b.setPadding(0, 0, 0, 0);
                      b.setGravity(Gravity.CENTER);
                      b.setTextSize(TypedValue.COMPLEX_UNIT_SP, Math.max(12f, 13f * s));
                  }

                  int tapSz = dp(Math.max(74f, 76f * s));
                  LinearLayout.LayoutParams tapLp = new LinearLayout.LayoutParams(tapSz, tapSz);
                  tapLp.gravity = Gravity.CENTER_HORIZONTAL;
                  tapLp.setMargins(0, dp(4f * s), 0, dp(8f * s));
                  tapBtn.setLayoutParams(tapLp);
                  tapBtn.setTextSize(TypedValue.COMPLEX_UNIT_SP, Math.max(15f, 16f * s));
                  if (tapBtn.getBackground() instanceof android.graphics.drawable.GradientDrawable) {
                      ((android.graphics.drawable.GradientDrawable) tapBtn.getBackground()).setCornerRadius(tapSz / 2f);
                  }

                  if (autoToggleBtn != null && autoToggleBtn.getParent() instanceof LinearLayout) {
                      LinearLayout actRow = (LinearLayout) autoToggleBtn.getParent();
                      actRow.setLayoutParams(new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ));
                  }
                  int actPadH = dp(Math.max(6f, 8f * s));
                  int actPadV = dp(Math.max(5f, 6f * s));
                  LinearLayout.LayoutParams aLp1 = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
                  aLp1.setMargins(0, 0, dp(6), 0);
                  autoToggleBtn.setLayoutParams(aLp1);
                  autoToggleBtn.setPadding(actPadH, actPadV, actPadH, actPadV);
                  autoToggleBtn.setSingleLine(true);
                  autoToggleBtn.setGravity(Gravity.CENTER);
                  autoToggleBtn.setTextSize(TypedValue.COMPLEX_UNIT_SP, Math.max(11.5f, 12.5f * s));

                  LinearLayout.LayoutParams aLp2 = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
                  resetBtn.setLayoutParams(aLp2);
                  resetBtn.setPadding(actPadH, actPadV, actPadH, actPadV);
                  resetBtn.setSingleLine(true);
                  resetBtn.setGravity(Gravity.CENTER);
                  resetBtn.setTextSize(TypedValue.COMPLEX_UNIT_SP, Math.max(11.5f, 12.5f * s));

                  if (params != null && windowManager != null) {
                      params.width = boxWidth;
                      params.height = WindowManager.LayoutParams.WRAP_CONTENT;
                      int maxX = Math.max(0, dm.widthPixels - boxWidth);
                      if (params.x > maxX) params.x = maxX;
                      rootView.requestLayout();
                      try { windowManager.updateViewLayout(rootView, params); } catch (Exception ignored) {}
                  }
              }

              private void refreshLabels() {
                  if (titleView != null) titleView.setText("Tasbeeh " + scalePct + "%");
                  if (countView != null) countView.setText(count + " / " + target);
                  if (autoToggleBtn != null) autoToggleBtn.setText(autoRunning ? "Pause" : "Auto");
              }

              private void persistState() {
                  getSharedPreferences(PREFS, MODE_PRIVATE).edit()
                      .putInt("count", count)
                      .putInt("target", target)
                      .putInt("scalePct", scalePct)
                      .putString("mode", mode)
                      .putLong("updatedAt", System.currentTimeMillis())
                      .apply();
              }

              private void startAuto() {
                  if (count >= target) return;
                  autoRunning = true;
                  handler.removeCallbacks(autoTick);
                  handler.postDelayed(autoTick, Math.max(1000L, intervalSec * 1000L));
              }

              private void stopAuto() {
                  autoRunning = false;
                  handler.removeCallbacks(autoTick);
              }

              private void vibrateShort(long ms) {
                  if (!vibrateEnabled) return;
                  try {
                      Vibrator vib = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                      if (vib == null) return;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          vib.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE));
                      } else {
                          vib.vibrate(ms);
                      }
                  } catch (Exception ignored) {}
              }

              private void stopAllahAudio() {
                  allahPlaysLeft = 0;
                  if (mediaPlayer != null) {
                      try {
                          if (mediaPlayer.isPlaying()) mediaPlayer.stop();
                          mediaPlayer.release();
                      } catch (Exception ignored) {}
                      mediaPlayer = null;
                  }
              }

              private void playAllahTimes(int times) {
                  if (!soundEnabled) return;
                  stopAllahAudio();
                  allahPlaysLeft = Math.max(1, times);
                  playNextAllahShot();
              }

              private void playNextAllahShot() {
                  if (allahPlaysLeft <= 0) {
                      stopAllahAudio();
                      return;
                  }
                  allahPlaysLeft--;
                  try {
                      AssetFileDescriptor afd = getAssets().openFd("public/allah.mp3");
                      mediaPlayer = new MediaPlayer();
                      mediaPlayer.setDataSource(afd.getFileDescriptor(), afd.getStartOffset(), afd.getLength());
                      afd.close();
                      mediaPlayer.setOnCompletionListener(mp -> {
                          try { mp.release(); } catch (Exception ignored) {}
                          mediaPlayer = null;
                          if (allahPlaysLeft > 0) {
                              handler.postDelayed(this::playNextAllahShot, 220);
                          }
                      });
                      mediaPlayer.prepare();
                      mediaPlayer.start();
                  } catch (Exception ignored) {
                      stopAllahAudio();
                  }
              }

              private void incrementCounter(boolean isManual) {
                  if (count >= target) return;
                  count++;
                  refreshLabels();
                  persistState();
                  if (count == target) {
                      boolean isAutoMode = !isManual && "auto".equalsIgnoreCase(mode);
                      stopAuto();
                      vibrateShort(180);
                      if (!completionPlayed) {
                          completionPlayed = true;
                          playAllahTimes(isAutoMode ? 3 : 1);
                      }
                      refreshLabels();
                  } else if (isManual) {
                      vibrateShort(20);
                  }
              }

              @Override
              public void onDestroy() {
                  stopAuto();
                  stopAllahAudio();
                  persistState();
                  if (windowManager != null && rootView != null) {
                      try { windowManager.removeView(rootView); } catch (Exception ignored) {}
                      rootView = null;
                  }
                  super.onDestroy();
              }
          }
          `;

          const pluginJava = `package ${appId};

          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "TasbeehOverlay")
          public class TasbeehOverlayPlugin extends Plugin {
              @PluginMethod
              public void checkPermission(PluginCall call) {
                  boolean granted = Build.VERSION.SDK_INT < Build.VERSION_CODES.M
                      || Settings.canDrawOverlays(getContext());
                  JSObject res = new JSObject();
                  res.put("granted", granted);
                  call.resolve(res);
              }

              @PluginMethod
              public void requestPermission(PluginCall call) {
                  Context ctx = getContext();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(ctx)) {
                      Intent intent = new Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:" + ctx.getPackageName())
                      );
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      ctx.startActivity(intent);
                  }
                  JSObject res = new JSObject();
                  res.put("requested", true);
                  call.resolve(res);
              }

              @PluginMethod
              public void showOverlay(PluginCall call) {
                  Context ctx = getContext();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(ctx)) {
                      JSObject res = new JSObject();
                      res.put("shown", false);
                      res.put("reason", "permission_required");
                      call.resolve(res);
                      return;
                  }
                  Intent svc = new Intent(ctx, TasbeehOverlayService.class);
                  svc.putExtra("count", call.getInt("count", 0));
                  svc.putExtra("target", call.getInt("target", 100));
                  svc.putExtra("mode", call.getString("mode", "manual"));
                  svc.putExtra("intervalSec", call.getInt("intervalSec", 1));
                  svc.putExtra("scalePct", call.getInt("scalePct", 45));
                  svc.putExtra("soundEnabled", call.getBoolean("soundEnabled", true));
                  svc.putExtra("vibrateEnabled", call.getBoolean("vibrateEnabled", true));
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      ctx.startForegroundService(svc);
                  } else {
                      ctx.startService(svc);
                  }
                  JSObject res = new JSObject();
                  res.put("shown", true);
                  call.resolve(res);
              }

              @PluginMethod
              public void updateOverlay(PluginCall call) {
                  Context ctx = getContext();
                  SharedPreferences sp = ctx.getSharedPreferences(TasbeehOverlayService.PREFS, Context.MODE_PRIVATE);
                  sp.edit()
                      .putInt("count", call.getInt("count", 0))
                      .putInt("target", call.getInt("target", 100))
                      .putInt("scalePct", call.getInt("scalePct", 45))
                      .putString("mode", call.getString("mode", "manual"))
                      .apply();
                  call.resolve();
              }

              @PluginMethod
              public void hideOverlay(PluginCall call) {
                  Context ctx = getContext();
                  ctx.stopService(new Intent(ctx, TasbeehOverlayService.class));
                  call.resolve();
              }

              @PluginMethod
              public void getState(PluginCall call) {
                  Context ctx = getContext();
                  SharedPreferences sp = ctx.getSharedPreferences(TasbeehOverlayService.PREFS, Context.MODE_PRIVATE);
                  JSObject res = new JSObject();
                  res.put("count", sp.getInt("count", 0));
                  res.put("target", sp.getInt("target", 100));
                  res.put("scalePct", sp.getInt("scalePct", 45));
                  res.put("updatedAt", sp.getLong("updatedAt", 0L));
                  call.resolve(res);
              }
          }
          `;

          const mainActivityJava = `package ${appId};
          
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebView;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;
          
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(TasbeehOverlayPlugin.class);
                  super.onCreate(savedInstanceState);
                  applyFullscreenAndNoBounce();
              }
          
              @Override
              public void onResume() {
                  super.onResume();
                  applyFullscreenAndNoBounce();
              }
          
              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      applyFullscreenAndNoBounce();
                  }
              }
          
              private void applyFullscreenAndNoBounce() {
                  try {
                      WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                      getWindow().setStatusBarColor(Color.TRANSPARENT);
                      getWindow().setNavigationBarColor(Color.TRANSPARENT);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          WindowManager.LayoutParams lp = getWindow().getAttributes();
                          lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                          getWindow().setAttributes(lp);
                      }
                      WindowInsetsControllerCompat controller = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                      if (controller != null) {
                          controller.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                          controller.hide(WindowInsetsCompat.Type.systemBars());
                      }
                      if (Build.VERSION.SDK_INT < 30) {
                          getWindow().getDecorView().setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                              | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_FULLSCREEN
                          );
                      }
                      if (getBridge() != null && getBridge().getWebView() != null) {
                          WebView wv = getBridge().getWebView();
                          wv.setOverScrollMode(View.OVER_SCROLL_NEVER);
                      }
                  } catch (Exception ignored) {}
              }
          }
          `;

          fs.writeFileSync(path.join(pkgDir, "TasbeehOverlayService.java"), serviceJava.trim() + "\n", "utf8");
          fs.writeFileSync(path.join(pkgDir, "TasbeehOverlayPlugin.java"), pluginJava.trim() + "\n", "utf8");
          fs.writeFileSync(path.join(pkgDir, "MainActivity.java"), mainActivityJava.trim() + "\n", "utf8");
          console.log("✅ Native Android System Overlay wired cleanly");
          OVERLAY_SETUP_EOF
          node /tmp/setup_android_overlay.js

      - name: Configure Transparent Bottom Nav Bar & Native Bounce Fix
        run: |
          # 1. Ensure AppTheme.NoActionBar keeps bottom nav bar visible & translucent (never fullscreen-hidden)
          for STY in android/app/src/main/res/values/styles.xml android/app/src/main/res/values-night/styles.xml; do
            if [ -f "$STY" ]; then
              node -e '
                const fs = require("fs");
                const p = process.argv[1];
                let xml = fs.readFileSync(p, "utf8");
                xml = xml.replace(/<style\s+name="AppTheme\.NoActionBar"[\s\S]*?<\/style>/, [
                  "    <style name=\"AppTheme.NoActionBar\" parent=\"Theme.AppCompat.DayNight.NoActionBar\">",
                  "        <item name=\"windowActionBar\">false</item>",
                  "        <item name=\"windowNoTitle\">true</item>",
                  "        <item name=\"android:background\">@null</item>",
                  "        <item name=\"android:windowFullscreen\">false</item>",
                  "        <item name=\"android:windowDrawsSystemBarBackgrounds\">true</item>",
                  "        <item name=\"android:windowTranslucentNavigation\">false</item>",
                  "        <item name=\"android:statusBarColor\">#0c3b2e</item>",
                  "        <item name=\"android:navigationBarColor\">#38000000</item>",
                  "    </style>"
                ].join("\n"));
                fs.writeFileSync(p, xml, "utf8");
              ' "$STY"
            fi
          done

          # 2. Write MainActivity.java: Always-Visible Opacity-Transparent Bottom Nav Bar + Seamless Top Status Bar + No Scroll Bounce
          MAIN_JAVA=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          if [ -z "$MAIN_JAVA" ]; then
            echo "❌ MainActivity.java not found!"
            exit 1
          fi
          PKG_LINE=$(grep -m1 "^package " "$MAIN_JAVA" || echo "package com.alaviyanooriya.awraad;")
          cat << JAVA_EOF > "$MAIN_JAVA"
          $PKG_LINE

          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.WebView;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  applyPermanentTransparentNavBar();
                  setupTopInsetOnly();
              }

              @Override
              public void onResume() {
                  super.onResume();
                  applyPermanentTransparentNavBar();
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      WebView wv = this.bridge.getWebView();
                      wv.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  }
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      applyPermanentTransparentNavBar();
                  }
              }

              private void setupTopInsetOnly() {
                  final View contentView = findViewById(android.R.id.content);
                  if (contentView == null) return;
                  contentView.setBackgroundColor(Color.parseColor("#0c3b2e"));
                  ViewCompat.setOnApplyWindowInsetsListener(contentView, (v, insets) -> {
                      int topInset = insets.getInsets(WindowInsetsCompat.Type.statusBars()).top;
                      // Top padded cleanly below status bar (zero navbar overlap); bottom = 0 so reading content flows behind transparent nav bar
                      v.setPadding(0, topInset, 0, 0);
                      return insets;
                  });
                  ViewCompat.requestApplyInsets(contentView);
              }

              private void applyPermanentTransparentNavBar() {
                  Window window = getWindow();
                  if (window == null) return;

                  // Draw content edge-to-edge behind a permanently visible translucent bottom navigation bar
                  WindowCompat.setDecorFitsSystemWindows(window, false);
                  window.clearFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN
                          | WindowManager.LayoutParams.FLAG_TRANSLUCENT_NAVIGATION
                          | WindowManager.LayoutParams.FLAG_TRANSLUCENT_STATUS);
                  window.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);

                  // Exact translucent dark-glass opacity style over page content (white ||| O < buttons always clearly visible)
                  window.setNavigationBarColor(Color.parseColor("#38000000"));
                  window.setStatusBarColor(Color.parseColor("#0c3b2e"));

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      window.setNavigationBarContrastEnforced(false);
                  }

                  View decorView = window.getDecorView();
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.R) {
                      // Android 9/10: Keep BOTH bars permanently visible (NO HIDE_NAVIGATION / NO IMMERSIVE_STICKY) while drawing behind bottom nav bar
                      decorView.setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      );
                  }

                  WindowInsetsControllerCompat controller = WindowCompat.getInsetsController(window, decorView);
                  if (controller != null) {
                      controller.show(WindowInsetsCompat.Type.statusBars() | WindowInsetsCompat.Type.navigationBars());
                      controller.setAppearanceLightStatusBars(false);
                      controller.setAppearanceLightNavigationBars(false);
                  }
              }
          }
          JAVA_EOF
          echo "✅ MainActivity.java & styles.xml updated: permanent opacity-transparent bottom nav bar"
      - name: Compile Android APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          EXPECTED_FP=""
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            printf "%s" "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > /tmp/perm-debug.p12
            rm -f android/app/permanent-debug.jks
            keytool -importkeystore \
              -srckeystore /tmp/perm-debug.p12 -srcstoretype PKCS12 -srcstorepass android \
              -destkeystore android/app/permanent-debug.jks -deststoretype JKS \
              -deststorepass android -destkeypass android -noprompt
            cp -f android/app/permanent-debug.jks ~/.android/debug.keystore
            EXPECTED_FP=$(keytool -list -keystore android/app/permanent-debug.jks -storepass android -alias androiddebugkey | grep -oE '([0-9A-F]{2}:){31}[0-9A-F]{2}' | head -n1)
            echo "✅ Permanent signing keystore locked (SHA-256: $EXPECTED_FP)"

            if ! grep -q "permanent-debug.jks" android/app/build.gradle; then
              cat << 'GRADLE_SIGN_EOF' >> android/app/build.gradle

          android {
              signingConfigs {
                  debug {
                      storeFile file('permanent-debug.jks')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          GRADLE_SIGN_EOF
            fi
          else
            echo "⚠️ ANDROID_KEYSTORE_BASE64 secret not set — using ephemeral debug keystore"
          fi

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "../Awraad-e-Alaviya-Nooriya.apk"
          ls -lh "../Awraad-e-Alaviya-Nooriya.apk"

          ACTUAL_FP=$(keytool -printcert -jarfile "../Awraad-e-Alaviya-Nooriya.apk" | grep -A1 "SHA256:" | grep -oE '([0-9A-F]{2}:){31}[0-9A-F]{2}' | head -n1)
          echo "🔐 Built APK SHA-256: $ACTUAL_FP"
          if [ -n "$EXPECTED_FP" ] && [ "$ACTUAL_FP" != "$EXPECTED_FP" ]; then
            echo "❌ ABORT: APK signature mismatch! Expected $EXPECTED_FP but got $ACTUAL_FP"
            exit 1
          fi
          echo "✅ APK SIGNATURE VERIFIED MATCH"

      - name: Deploy 2-in-1 Live Web App to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
          keep_files: false

      - name: Clear Old Release & Publish Permanent Android APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag >/dev/null 2>&1 || true
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/latest" >/dev/null 2>&1 || true
          sleep 2

          gh release create latest "Awraad-e-Alaviya-Nooriya.apk" \
            --target "${{ github.sha }}" \
            --title "Awraad e Alaviya Nooriya (Latest APK)" \
            --notes "**Permanent Auto-Updating Android APK (Build #${{ github.run_number }})**
          Lightweight build — launches directly into 10-second Powered By Silsila e Alaviya Nooriya splash screen." \
            --latest
