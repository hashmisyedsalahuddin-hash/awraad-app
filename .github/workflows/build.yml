name: Build Auto-Updating APK & Deploy iPhone Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Extract Project Bundle
        run: |
          unzip -o awraad-project.zip

      - name: Ensure Uncropped Icons & Full-Screen Portrait Splash
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick

          if [ -f "assets/original_icon.png" ]; then
            convert assets/original_icon.png -resize 760x760 -background "#0c3b2e" -gravity center -extent 1024x1024 assets/icon.png
            convert assets/original_icon.png -resize 1000x1000 -background "#0c3b2e" -gravity center -extent 1080x1920 assets/full_splash.png
            cp assets/full_splash.png assets/splash.png
            cp assets/full_splash.png assets/splash-dark.png
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Capacitor Dependencies
        run: |
          npm install

      - name: Prepare 2-in-1 Web App (iPhone PWA + Android Live Sync)
        run: |
          # GitHub Pages par sabhi files properly load hone ke liye
          touch www/.nojekyll

          # 1. iPhone & Web App Icons (Solid #0c3b2e background, no black edges)
          SOURCE_ICON=""
          if [ -f "assets/original_icon.png" ]; then
            SOURCE_ICON="assets/original_icon.png"
          elif [ -f "assets/icon.png" ]; then
            SOURCE_ICON="assets/icon.png"
          fi

          if [ -n "$SOURCE_ICON" ]; then
            convert "$SOURCE_ICON" -resize 150x150 -background "#0c3b2e" -gravity center -extent 180x180 -alpha remove -alpha off www/apple-touch-icon.png
            convert "$SOURCE_ICON" -resize 160x160 -background "#0c3b2e" -gravity center -extent 192x192 -alpha remove -alpha off www/icon-192.png
            convert "$SOURCE_ICON" -resize 420x420 -background "#0c3b2e" -gravity center -extent 512x512 -alpha remove -alpha off www/icon-512.png
          fi

          # 2. Web App Manifest
          if [ ! -f "www/manifest.json" ]; then
            cat << 'EOF' > www/manifest.json
          {
            "name": "Awraad e Alaviya Nooriya",
            "short_name": "Awraad",
            "description": "Awraad e Alaviya Nooriya Web & Mobile App",
            "start_url": "./index.html",
            "scope": "./",
            "display": "standalone",
            "orientation": "portrait",
            "background_color": "#0c3b2e",
            "theme_color": "#0c3b2e",
            "icons": [
              {
                "src": "./icon-192.png",
                "sizes": "192x192",
                "type": "image/png",
                "purpose": "any maskable"
              },
              {
                "src": "./icon-512.png",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "any maskable"
              }
            ]
          }
          EOF
          fi

          # 2b. Zero-Flash theme-preload.js fallback (agar zip mein missing ho)
          if [ ! -s "www/theme-preload.js" ]; then
            cat << 'EOF' > www/theme-preload.js
          (function() {
            try {
              var root = document.documentElement;
              var head = document.head || root;
              var isDark = localStorage.getItem('theme') === 'dark';
              var savedBg = localStorage.getItem('app_custom_bg');
              var savedText = localStorage.getItem('app_custom_text');
              var savedSize = localStorage.getItem('app_font_size');
              var savedContentFont = localStorage.getItem('app_content_font');
              var savedAppFont = localStorage.getItem('app_ui_font');
              var tajweedOff = localStorage.getItem('app_tajweed_colors') === 'false';

              if (isDark) root.classList.add('dark-mode');
              if (tajweedOff) root.classList.add('tajweed-colors-off');

              var lockCss = '';

              if (savedBg && /^#[0-9a-fA-F]{6}$/.test(savedBg)) {
                var r = parseInt(savedBg.substring(1, 3), 16);
                var g = parseInt(savedBg.substring(3, 5), 16);
                var b = parseInt(savedBg.substring(5, 7), 16);
                var r1 = r / 255, g1 = g / 255, b1 = b / 255;
                var max = Math.max(r1, g1, b1), min = Math.min(r1, g1, b1);
                var h = 0, s = 0, l = (max + min) / 2;
                if (max !== min) {
                  var d = max - min;
                  s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                  if (max === r1) h = (g1 - b1) / d + (g1 < b1 ? 6 : 0);
                  else if (max === g1) h = (b1 - r1) / d + 2;
                  else h = (r1 - g1) / d + 4;
                  h *= 60;
                }
                h = Math.round(h); s = Math.round(s * 100); l = Math.round(l * 100);
                var toLin = function(c) { var v = c / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
                var lum = 0.2126 * toLin(r) + 0.7152 * toLin(g) + 0.0722 * toLin(b);
                var isDarkBg = lum < 0.28;
                var isNeutral = s < 10;

                var t;
                if (!isDarkBg) {
                  var cardL = l > 94 ? l - 4 : Math.min(l + 6, 98);
                  var navL = Math.max(l - 5, 76);
                  var borderL = Math.max(l - 34, 28);
                  t = {
                    text: isNeutral ? '#111111' : 'hsl(' + h + ',' + Math.min(s, 45) + '%,14%)',
                    cardBg: isNeutral ? 'hsl(0,0%,' + cardL + '%)' : 'hsl(' + h + ',' + Math.min(s, 42) + '%,' + cardL + '%)',
                    cardText: isNeutral ? '#1a365d' : 'hsl(' + h + ',' + Math.min(s, 65) + '%,18%)',
                    cardSubtext: isNeutral ? '#555555' : 'hsl(' + h + ',' + Math.min(s, 38) + '%,34%)',
                    cardHoverBg: isNeutral ? '#1a365d' : 'hsl(' + h + ',' + Math.min(s + 10, 68) + '%,30%)',
                    cardHoverText: '#ffffff',
                    border: isNeutral ? '#9a7b2c' : 'hsl(' + h + ',' + Math.min(s + 10, 65) + '%,' + borderL + '%)',
                    ruledBorder: isNeutral ? 'rgba(120,130,145,0.45)' : 'hsla(' + h + ',' + Math.min(s, 45) + '%,' + borderL + '%,0.45)',
                    navBg: isNeutral ? 'hsl(0,0%,' + navL + '%)' : 'hsl(' + h + ',' + Math.min(s, 35) + '%,' + navL + '%)',
                    tableHeadBg: isNeutral ? '#1a365d' : 'hsl(' + h + ',' + Math.min(s + 5, 60) + '%,26%)',
                    tableHeadText: '#ffffff'
                  };
                } else {
                  var cardL2 = Math.min(l + 9, 34);
                  var navL2 = Math.max(l - 4, 8);
                  var borderL2 = Math.min(l + 32, 74);
                  t = {
                    text: isNeutral ? '#f5f6fa' : 'hsl(' + h + ',' + Math.min(s, 25) + '%,95%)',
                    cardBg: isNeutral ? 'hsl(0,0%,' + cardL2 + '%)' : 'hsl(' + h + ',' + Math.min(s, 38) + '%,' + cardL2 + '%)',
                    cardText: isNeutral ? '#ffffff' : 'hsl(' + h + ',' + Math.min(s, 32) + '%,96%)',
                    cardSubtext: isNeutral ? '#c8ccd4' : 'hsl(' + h + ',' + Math.min(s, 30) + '%,78%)',
                    cardHoverBg: isNeutral ? '#c59b27' : 'hsl(' + h + ',' + Math.min(s + 12, 70) + '%,' + Math.min(l + 26, 68) + '%)',
                    cardHoverText: '#111111',
                    border: isNeutral ? '#c59b27' : 'hsl(' + h + ',' + Math.min(s + 15, 70) + '%,' + borderL2 + '%)',
                    ruledBorder: isNeutral ? 'rgba(220,225,235,0.30)' : 'hsla(' + h + ',' + Math.min(s, 45) + '%,' + borderL2 + '%,0.38)',
                    navBg: isNeutral ? 'hsl(0,0%,' + navL2 + '%)' : 'hsl(' + h + ',' + Math.min(s, 35) + '%,' + navL2 + '%)',
                    tableHeadBg: isNeutral ? '#2d3748' : 'hsl(' + h + ',' + Math.min(s + 8, 55) + '%,' + Math.min(l + 16, 40) + '%)',
                    tableHeadText: '#ffffff'
                  };
                }

                root.style.backgroundColor = savedBg;
                root.style.setProperty('--user-bg-color', savedBg);
                root.style.setProperty('--auto-text', t.text);
                root.style.setProperty('--auto-card-bg', t.cardBg);
                root.style.setProperty('--auto-card-text', t.cardText);
                root.style.setProperty('--auto-card-subtext', t.cardSubtext);
                root.style.setProperty('--auto-card-hover-bg', t.cardHoverBg);
                root.style.setProperty('--auto-card-hover-text', t.cardHoverText);
                root.style.setProperty('--auto-border', t.border);
                root.style.setProperty('--auto-ruled-border', t.ruledBorder);
                root.style.setProperty('--auto-nav-bg', t.navBg);
                root.style.setProperty('--auto-table-head-bg', t.tableHeadBg);
                root.style.setProperty('--auto-table-head-text', t.tableHeadText);
                root.classList.add('custom-bg-active');
                if (isDarkBg) root.classList.add('custom-bg-dark');

                lockCss =
                  '@media screen{' +
                  'html,body,.continuous-frame,.continuous-inner{background:' + savedBg + ' !important;background-color:' + savedBg + ' !important;}' +
                  '.app-navbar{background-color:' + t.navBg + ' !important;border-bottom-color:' + t.border + ' !important;}' +
                  '.nav-card,.sub-nav-card,.daily-malfooz-container,.malfooz-card,.shijra-table,.name-card,.timer-card{background-color:' + t.cardBg + ' !important;border-color:' + t.border + ' !important;}' +
                  '}';
              } else if (isDark) {
                root.style.backgroundColor = '#121212';
                lockCss =
                  '@media screen{' +
                  'html,body{background:#121212 !important;background-color:#121212 !important;color:#f5f6fa !important;}' +
                  '.continuous-frame,.continuous-inner{background:#1e1e1e !important;background-color:#1e1e1e !important;}' +
                  '.app-navbar{background-color:#2a2a2a !important;}' +
                  '}';
              }

              if (lockCss && head) {
                var st = document.getElementById('awraad-preload-lock');
                if (!st) {
                  st = document.createElement('style');
                  st.id = 'awraad-preload-lock';
                  head.appendChild(st);
                }
                st.textContent = lockCss;
              }

              if (savedText) {
                root.style.setProperty('--user-text-color', savedText);
                root.classList.add('custom-text-active');
              }
              if (savedSize) {
                root.style.setProperty('--user-font-size', savedSize + 'px');
                root.classList.add('custom-size-active');
              }
              if (savedContentFont) {
                root.style.setProperty('--user-content-font', savedContentFont);
                root.classList.add('custom-content-font-active');
              }
              if (savedAppFont) {
                root.style.setProperty('--user-app-font', savedAppFont);
                root.classList.add('custom-app-font-active');
              }

              if (head && !document.getElementById('awraad-amiri-font-link')) {
                var fl = document.createElement('link');
                fl.id = 'awraad-amiri-font-link';
                fl.rel = 'stylesheet';
                fl.href = 'https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,700;1,700&display=swap';
                head.appendChild(fl);
              }
            } catch (e) {}
          })();
          EOF
          fi

          # 3. External PWA Registration + Auto-Refresh Script (iPhone & Android Live APK dono ke liye)
          cat << 'EOF' > www/pwa-init.js
          if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
            const hadController = Boolean(navigator.serviceWorker.controller);
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
              if (hadController && !refreshing) {
                refreshing = true;
                window.location.reload();
              }
            });
            window.addEventListener('load', () => {
              navigator.serviceWorker.register('./sw.js').then((reg) => {
                reg.update();
              }).catch(() => {});
            });
          }
          EOF

          # 4. Auto-Updating Fast Service Worker (Har build par sabhi HTML/CSS/JS pre-cache + 0ms page switching)
          BUILD_NUM="${{ github.run_number }}" node -e '
            const fs = require("fs");
            const path = require("path");
            function walk(dir, base = "") {
              let out = [];
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const rel = base ? base + "/" + entry.name : entry.name;
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) out = out.concat(walk(full, rel));
                else if (/\.(html|css|js|json)$/i.test(entry.name) && entry.name !== "sw.js") {
                  out.push("./" + rel);
                }
              }
              return out;
            }
            const allAssets = Array.from(new Set(["./", ...walk("www")]));
            const swLines = [
              "const CACHE_NAME = \"awraad-live-v" + process.env.BUILD_NUM + "\";",
              "const CORE_ASSETS = " + JSON.stringify(allAssets, null, 2) + ";",
              "",
              "self.addEventListener(\"install\", (event) => {",
              "  event.waitUntil(",
              "    caches.open(CACHE_NAME).then((cache) =>",
              "      Promise.all(CORE_ASSETS.map((url) => cache.add(url).catch(() => {})))",
              "    )",
              "  );",
              "  self.skipWaiting();",
              "});",
              "",
              "self.addEventListener(\"activate\", (event) => {",
              "  event.waitUntil(",
              "    caches.keys().then((keys) =>",
              "      Promise.all(keys.filter((k) => k !== CACHE_NAME).map((k) => caches.delete(k)))",
              "    )",
              "  );",
              "  self.clients.claim();",
              "});",
              "",
              "self.addEventListener(\"fetch\", (event) => {",
              "  if (event.request.method !== \"GET\") return;",
              "  event.respondWith(",
              "    caches.match(event.request).then((cached) => {",
              "      const networkUpdate = fetch(event.request)",
              "        .then((response) => {",
              "          if (response && response.status === 200) {",
              "            const copy = response.clone();",
              "            caches.open(CACHE_NAME).then((cache) => cache.put(event.request, copy));",
              "          }",
              "          return response;",
              "        })",
              "        .catch(() => cached);",
              "      return cached || networkUpdate;",
              "    })",
              "  );",
              "});"
            ];
            fs.writeFileSync("www/sw.js", swLines.join("\n") + "\n", "utf8");
          '

          # 5. Sabhi HTML files (subfolders samet) mein <head> ke SABSE TOP par theme-preload.js + PWA tags inject karein
          node -e '
            const fs = require("fs");
            const path = require("path");

            function getAllHtmlFiles(dir, depth = 0) {
              let results = [];
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  results = results.concat(getAllHtmlFiles(full, depth + 1));
                } else if (entry.name.toLowerCase().endsWith(".html")) {
                  results.push({ fullPath: full, prefix: depth === 0 ? "./" : "../".repeat(depth) });
                }
              }
              return results;
            }

            for (const { fullPath, prefix } of getAllHtmlFiles("www")) {
              let html = fs.readFileSync(fullPath, "utf8");
              const iosMeta = [
                "  <meta name=\"apple-mobile-web-app-capable\" content=\"yes\">",
                "  <meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">",
                "  <meta name=\"apple-mobile-web-app-title\" content=\"Awraad\">",
                "  <meta name=\"theme-color\" content=\"#0c3b2e\">",
                "  <link rel=\"apple-touch-icon\" sizes=\"180x180\" href=\"" + prefix + "apple-touch-icon.png\">",
                "  <link rel=\"manifest\" href=\"" + prefix + "manifest.json\">",
                "  <script src=\"" + prefix + "pwa-init.js\" defer></script>"
              ].join("\n");

              if (!html.includes("viewport-fit=cover")) {
                html = html.replace(/content="([^"]*width=device-width[^"]*)"/i, "content=\"$1, viewport-fit=cover\"");
              }

              // Purane theme-preload.js tag ko remove karke <head> ke BILKUL TOP par lagayein (CSS se pehle)
              html = html.replace(/[ \t]*<script[^>]+theme-preload\.js[^>]*><\/script>\r?\n?/gi, "");
              const preloadTag = "  <script src=\"" + prefix + "theme-preload.js\"></script>";
              if (/<head\b[^>]*>/i.test(html)) {
                html = html.replace(/(<head\b[^>]*>)/i, "$1\n" + preloadTag);
              } else {
                html = preloadTag + "\n" + html;
              }

              if (!html.includes("apple-mobile-web-app-capable")) {
                if (/<\/head>/i.test(html)) {
                  html = html.replace(/<\/head>/i, iosMeta + "\n</head>");
                } else {
                  html = iosMeta + "\n" + html;
                }
              }
              fs.writeFileSync(fullPath, html, "utf8");
            }
          '

      - name: Connect Android APK to Live GitHub Pages URL (Zero-Reinstall Updates)
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          REPO_LOWER=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')

          if [ "$REPO_LOWER" = "${OWNER}.github.io" ]; then
            PAGES_URL="https://${OWNER}.github.io/"
          else
            PAGES_URL="https://${OWNER}.github.io/${REPO}/"
          fi

          echo "Live Auto-Update URL: $PAGES_URL"

          PAGES_URL="$PAGES_URL" node -e '
            const fs = require("fs");
            const url = process.env.PAGES_URL;
            const host = new URL(url).hostname;

            if (fs.existsSync("capacitor.config.json")) {
              const cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
              delete cfg.bundledWebRuntime;
              cfg.server = {
                ...(cfg.server || {}),
                url: url,
                cleartext: false,
                errorPath: "index.html",
                allowNavigation: [host]
              };
              fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
              console.log("Updated capacitor.config.json with live URL:", url);
            } else if (fs.existsSync("capacitor.config.ts")) {
              let ts = fs.readFileSync("capacitor.config.ts", "utf8");
              ts = ts.replace(/^\s*bundledWebRuntime\s*:\s*(true|false)\s*,?\s*\r?\n/gm, "");
              const serverBlock = "  server: {\n    url: \"" + url + "\",\n    cleartext: false,\n    errorPath: \"index.html\",\n    allowNavigation: [\"" + host + "\"]\n  },\n";
              if (ts.includes("server:")) {
                ts = ts.replace(/server\s*:\s*\{[\s\S]*?\},?/, serverBlock.trim() + ",");
              } else {
                ts = ts.replace(/,?\s*\n\s*\};/, ",\n" + serverBlock + "};");
              }
              fs.writeFileSync("capacitor.config.ts", ts, "utf8");
              console.log("Updated capacitor.config.ts with live URL:", url);
            }
          '

      - name: Generate Native Android Project & Apply Full-Screen Splash
        run: |
          [ -d "android" ] || npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor "#0c3b2e" --splashBackgroundColor "#0c3b2e"
          npx cap sync android

          # Har build par Android versionCode automatically badhega
          sed -i "s/versionCode [0-9]\+/versionCode ${{ github.run_number }}/g" android/app/build.gradle

          # 1. Android 12+ ka chota gol circle wala splash (values-v31) remove karein
          rm -rf android/app/src/main/res/values-v31
          rm -rf android/app/src/main/res/values-night-v31

          # 2. Uncropped 1080x1920 splash image har drawable folder mein rakhein
          for dir in android/app/src/main/res/drawable*; do
            if [ -d "$dir" ]; then
              cp assets/full_splash.png "$dir/splash.png"
            fi
          done

          # 3. Custom launch_splash.xml (Zero cropping, centered full frame)
          mkdir -p android/app/src/main/res/drawable
          cat << 'EOF' > android/app/src/main/res/drawable/launch_splash.xml
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/colorPrimaryDark" />
              <item>
                  <bitmap
                      android:gravity="center"
                      android:src="@drawable/splash" />
              </item>
          </layer-list>
          EOF

          # 4. Deep Green (#0c3b2e) Fullscreen Launch Theme
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">#0c3b2e</item>
                  <item name="colorPrimaryDark">#0c3b2e</item>
                  <item name="colorAccent">#d4af37</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:background">@null</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">@drawable/launch_splash</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:statusBarColor">#0c3b2e</item>
                  <item name="android:navigationBarColor">#0c3b2e</item>
              </style>
          </resources>
          EOF

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Compile Android APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          fi
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "../Awraad-e-Alaviya-Nooriya.apk"

      - name: Deploy 2-in-1 Live Web App to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
          keep_files: false

      - name: Clear Old Release & Publish Permanent Android APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag >/dev/null 2>&1 || true
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/latest" >/dev/null 2>&1 || true
          sleep 2

          gh release create latest "Awraad-e-Alaviya-Nooriya.apk" \
            --target "${{ github.sha }}" \
            --title "Awraad e Alaviya Nooriya (Latest APK)" \
            --notes "**Permanent Auto-Updating Android APK (Build #${{ github.run_number }})**
          Is APK ko sirf ek baar install karna hai. Aage ke sabhi web updates GitHub se automatically aate rahenge." \
            --latest
