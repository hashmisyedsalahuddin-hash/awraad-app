name: Build Android APK & iPhone App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Clean Project
        run: |
          unzip -o awraad-project.zip

      - name: Prepare High-Res PNG Icon & Splash
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          ICON_FILE=$(find assets -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) | head -n 1)
          convert "$ICON_FILE" -resize 1024x1024! assets/icon.png
          convert "$ICON_FILE" -resize 2732x2732 -background "#0f3d2e" -gravity center -extent 2732x2732 assets/splash.png
          cp assets/splash.png assets/splash-dark.png

      - name: Configure iPhone Full-Screen & Icon (PWA Setup)
        run: |
          # Icon ko www folder mein copy karein iPhone ke liye
          cp assets/icon.png www/icon.png
          
          # manifest.json banayein taaki app full-screen chale
          cat << 'EOF' > www/manifest.json
          {
            "name": "Awraad-e-Alaviya Nooriya",
            "short_name": "Awraad",
            "start_url": "./index.html",
            "display": "standalone",
            "background_color": "#0f3d2e",
            "theme_color": "#0f3d2e",
            "icons": [
              {
                "src": "icon.png",
                "sizes": "1024x1024",
                "type": "image/png",
                "purpose": "any maskable"
              }
            ]
          }
          EOF

          # Saari HTML files mein iPhone icon aur full-screen tags inject karein
          for f in www/*.html; do
            sed -i 's|<head>|<head>\n<link rel="apple-touch-icon" href="icon.png">\n<link rel="manifest" href="manifest.json">\n<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">\n<meta name="apple-mobile-web-app-title" content="Awraad">|i' "$f"
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Initialize Capacitor & Install Packages Fresh
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          npx cap init "Awraad-e-Alaviya" "com.awraad.alaviya" --web-dir www

      - name: Add Android & Generate Custom Icons
        run: |
          npx cap add android
          npx @capacitor/assets generate --android
          npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Awraad-e-Alaviya-Nooriya-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Deploy iPhone Web App to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
