name: Build APK & Deploy iPhone Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Bundle
        run: |
          unzip -o awraad-project.zip

      - name: Create Full-Page Responsive Green Splash & Clean Icon
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          
          # 1. Original icon ke bahar ka white/cream border crop karke sirf green-gold box nikalein
          convert assets/icon.png -gravity center -crop 62%x62%+0+0 +repage assets/green_core.png
          
          # 2. App Icon ko bhi full green-gold banayein (bina white border ke)
          convert assets/green_core.png -resize 1024x1024! assets/icon.png
          cp assets/icon.png www/icon.png
          convert assets/icon.png -resize 180x180! www/apple-touch-icon.png
          convert assets/icon.png -resize 192x192! www/icon-192.png
          convert assets/icon.png -resize 512x512! www/icon-512.png

          # 3. Har mobile ki full screen safe-zone (1150x1150) mein calligraphy set karein aur poora 2732x2732 page Deep Green (#0b3b2c) rakhein
          convert assets/green_core.png -resize 1150x1150 -background "#0b3b2c" -gravity center -extent 2732x2732 assets/splash.png
          cp assets/splash.png assets/splash-dark.png

      - name: Auto-Fix All Case-Sensitive Links (Index.html vs index.html)
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const files = fs.readdirSync("www");
          const htmlFiles = files.filter(f => f.toLowerCase().endsWith(".html") || f.toLowerCase().endsWith(".js"));

          htmlFiles.forEach(hFile => {
            const p = path.join("www", hFile);
            let content = fs.readFileSync(p, "utf8");
            files.forEach(actualFile => {
              const escaped = actualFile.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const regex = new RegExp(escaped, "gi");
              content = content.replace(regex, actualFile);
            });
            fs.writeFileSync(p, content, "utf8");
          });
          '
          cp www/index.html www/Index.html

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor Dependencies
        run: |
          npm install

      - name: Generate Native Android Project & Custom Icons
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --splashBackgroundColor "#0b3b2c" --splashBackgroundColorDark "#0b3b2c"
          npx cap sync android
          
          # Android ke तमाम screen folders mein full-screen green background fix karein
          find android/app/src/main/res -name "styles.xml" -exec sed -i 's|#FFFFFF|#0b3b2c|g; s|#000000|#0b3b2c|g' {} +

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Compile Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "../Awraad e Alaviya Nooriya.apk"

      - name: Upload "Awraad e Alaviya Nooriya.apk" Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Awraad e Alaviya Nooriya
          path: "Awraad e Alaviya Nooriya.apk"

      - name: Deploy iPhone Safari Web App to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
          keep_files: false
