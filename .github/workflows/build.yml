name: Build APK & Deploy iPhone Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Bundle
        run: |
          unzip -o awraad-project.zip

      - name: Prepare Uncropped Safe Icons & Full-Screen Portrait Splash
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          
          # 1. Original icon mein se sirf bahar ka white margin hatayein (58% green plaque hai)
          convert assets/icon.png -gravity center -crop 59%x59%+0+0 +repage assets/green_box.png
          
          # 2. Android Adaptive App Icon ke circle se huroof na katein, isliye green_box ko 700x700 rakh kar 1024x1024 green canvas par rakhein
          convert assets/green_box.png -resize 700x700 -background "#0c3b2e" -gravity center -extent 1024x1024 assets/icon.png
          
          # 3. iPhone aur PWA ke liye full square green_box icon rakhein
          convert assets/green_box.png -resize 180x180! www/apple-touch-icon.png
          convert assets/green_box.png -resize 192x192! www/icon-192.png
          convert assets/green_box.png -resize 512x512! www/icon-512.png
          cp www/icon-512.png www/icon.png

          # 4. Har mobile screen (1080x1920 Portrait) ke liye Full-Width (1040px) Splash Screen banayein
          convert assets/green_box.png -resize 1040x1040 -background "#0c3b2e" -gravity center -extent 1080x1920 assets/full_splash.png
          cp assets/full_splash.png assets/splash.png
          cp assets/full_splash.png assets/splash-dark.png

      - name: Auto-Fix All Case-Sensitive Links (Index.html vs index.html)
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const files = fs.readdirSync("www");
          const htmlFiles = files.filter(f => f.toLowerCase().endsWith(".html") || f.toLowerCase().endsWith(".js"));

          htmlFiles.forEach(hFile => {
            const p = path.join("www", hFile);
            let content = fs.readFileSync(p, "utf8");
            files.forEach(actualFile => {
              const escaped = actualFile.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const regex = new RegExp(escaped, "gi");
              content = content.replace(regex, actualFile);
            });
            fs.writeFileSync(p, content, "utf8");
          });
          '
          cp www/index.html www/Index.html

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor Dependencies
        run: |
          npm install

      - name: Generate Native Android Project & Force Full-Screen Splash
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor "#0c3b2e" --splashBackgroundColor "#0c3b2e"
          npx cap sync android
          
          # 1. Android 12+ ka chota gol circle wala splash (values-v31) HATA DEIN taaki full-screen splash dikhe
          rm -rf android/app/src/main/res/values-v31
          rm -rf android/app/src/main/res/values-night-v31
          
          # 2. Apni 1080x1920 full-screen splash image ko Android ke har drawable folder mein direct copy karein
          for dir in android/app/src/main/res/drawable*; do
            if [ -d "$dir" ]; then
              cp assets/full_splash.png "$dir/splash.png"
            fi
          done
          
          # 3. Custom launch_splash.xml banayein jo har mobile screen par image ko full-screen fit rakhe (bina kate)
          mkdir -p android/app/src/main/res/drawable
          cat << 'EOF' > android/app/src/main/res/drawable/launch_splash.xml
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/colorPrimaryDark" />
              <item>
                  <bitmap
                      android:gravity="center"
                      android:src="@drawable/splash" />
              </item>
          </layer-list>
          EOF

          # 4. colorPrimaryDark ko Deep Green (#0c3b2e) set karein aur styles.xml mein apna full-screen splash lagayein
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">#0c3b2e</item>
                  <item name="colorPrimaryDark">#0c3b2e</item>
                  <item name="colorAccent">#d4af37</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:background">@null</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">@drawable/launch_splash</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:statusBarColor">#0c3b2e</item>
                  <item name="android:navigationBarColor">#0c3b2e</item>
              </style>
          </resources>
          EOF

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Compile Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "../Awraad e Alaviya Nooriya.apk"

      - name: Upload "Awraad e Alaviya Nooriya.apk" Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Awraad e Alaviya Nooriya
          path: "Awraad e Alaviya Nooriya.apk"

      - name: Deploy iPhone Safari Web App to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
          keep_files: false
